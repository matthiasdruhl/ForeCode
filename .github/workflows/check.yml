name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      META_CALLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check pinned external contract reference
        env:
          PLAN_REFERENCE_ROOT: ${{ runner.temp }}/forecode-plan-reference
        run: |
          git init --bare "$PLAN_REFERENCE_ROOT"
          git -C "$PLAN_REFERENCE_ROOT" fetch --depth=1 https://github.com/matthiasdruhl/AgentHarness-Planning.git 695e68a40b5f5009c9b06b83a1181e18cd6d0223
          npm run test:plan
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:fixture-e2e
      - name: Verify standalone task export
        run: |
          fixture_export="${{ runner.temp }}/forecode-booking-standalone"
          npm run prepare:booking -- --output "$fixture_export"
          npm --prefix "$fixture_export" ci --ignore-scripts
          npm --prefix "$fixture_export" test
          npm --prefix "$fixture_export" run typecheck
          npm --prefix "$fixture_export" run build
